<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../../images/favicon-white.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Applications & Membership — GSMP Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/admin.css?v=3">
</head>
<body class="adm">
 <div class="adm-shell">
  <aside class="adm-side" id="admSide"></aside>
  <main class="adm-main">
  <div class="wrap">
    <header class="adm-top"><div><h1>Applications &amp; membership</h1><p class="adm-sub">Review applicants, record payments, track renewals.</p></div></header>
    <div id="msg" class="msg"></div>
    <div id="gate" class="panel">Checking access…</div>
    <div id="app" style="display:none;">
      <div class="stats" id="stats"></div>
      <div class="tabs" id="tabs"></div>
      <div id="list"></div>
    </div>
  </div>

  </main>
 </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../../js/supabase-config.js"></script>
  <script src="../../js/admin-shell.js?v=3"></script>
  <script>
    const e = gsmpEsc, $ = id => document.getElementById(id);
    const TABS = [['applicant', 'To review'], ['reported', 'Payment reported'], ['approved', 'Awaiting payment'], ['grace', 'Renewal due'], ['lapsed', 'Lapsed'],
                  ['active', 'Active'], ['rejected', 'Rejected']];
    let tab = 'applicant', members = [], chapters = {}, reports = {};
    const fmt = d => d ? new Date(d.length === 10 ? d + 'T00:00:00' : d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
    const today = () => new Date().toISOString().slice(0, 10);
    const addYear = iso => { const d = new Date(iso + 'T00:00:00'); d.setFullYear(d.getFullYear() + 1); return d.toISOString().slice(0, 10); };
    const FEE = 100;
    function flash(t, ok) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (ok ? 'ok' : 'err'); window.scrollTo({ top: 0 }); }

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.href = '../login'; return; }
      if (!(await checkIsSaasAdmin())) { $('gate').textContent = 'Admins only.'; return; }
      $('gate').style.display = 'none'; $('app').style.display = ''; gsmpAdminShell('applications');
      const { data: ch } = await sb.from('chapters').select('id, name');
      (ch || []).forEach(c => chapters[c.id] = c.name);
      load();
    })();

    async function load() {
      const { data, error } = await sb.from('members')
        .select('id, first_name, last_name, email, phone, school, degree, year, field, specialty, country, city, referred_by, chapter_id, requested_chapter_id, membership_status, paid_until, application_message, review_note, reviewed_by, reviewed_at, applied_at, joined_at')
        .order('applied_at', { ascending: true, nullsFirst: false });
      if (error) return flash(error.message, false);
      const { data: reps } = await sb.from('payment_reports').select('*').eq('status', 'open').order('created_at', { ascending: false });
      reports = {}; (reps || []).forEach(r => { if (!reports[r.member_id]) reports[r.member_id] = r; });
      members = data.map(m => ({ ...m, st: gsmpMemberState(m), rep: reports[m.id] || null }));
      const count = k => k === 'reported' ? members.filter(m => m.rep).length : members.filter(m => m.st === k).length;
      $('stats').innerHTML = TABS.map(([k, l]) => `<div class="stat"><b>${count(k)}</b><span class="muted">${l}</span></div>`).join('');
      renderTabs(); render();
    }
    function renderTabs() { $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" onclick="setTab('${k}')">${l}</button>`).join(''); }
    function setTab(k) { tab = k; renderTabs(); render(); }

    function render() {
      let list = tab === 'reported' ? members.filter(m => m.rep) : members.filter(m => m.st === tab);
      if (tab === 'applicant') list.sort((a, b) => (b.referred_by ? 1 : 0) - (a.referred_by ? 1 : 0)); // referred first
      if (['active', 'grace', 'lapsed'].includes(tab)) list.sort((a, b) => (a.paid_until || '9999').localeCompare(b.paid_until || '9999'));
      if (!list.length) { $('list').innerHTML = '<div class="panel muted">Nothing here.</div>'; return; }
      $('list').innerHTML = list.map(card).join('');
    }

    function card(m) {
      const name = e(((m.first_name || '') + ' ' + (m.last_name || '')).trim());
      const ch = chapters[m.chapter_id] || (m.requested_chapter_id ? chapters[m.requested_chapter_id] + ' (requested)' : '—');
      const waitDays = m.applied_at ? Math.floor((Date.now() - new Date(m.applied_at)) / 86400000) : null;
      let actions = '';
      if (m.st === 'applicant' || m.st === 'rejected') actions = `
        <button class="ok" onclick="setStatus('${m.id}','approved')">Approve</button>
        ${m.st === 'applicant' ? `<button class="bad" onclick="setStatus('${m.id}','rejected')">Reject</button>` : ''}`;
      const base = m.paid_until && m.paid_until > today() ? m.paid_until : today();
      const payRow = `<div style="width:100%;border-top:1px solid var(--line);padding-top:8px;margin-top:4px;">
        <div class="muted" style="margin-bottom:6px;">Record payment</div>
        <div class="row">
          <input id="amt-${m.id}" type="number" min="1" step="0.01" value="${(m.rep && m.rep.amount) || FEE}" style="width:90px;">
          <input id="cur-${m.id}" value="${e((m.rep && m.rep.currency) || 'USD')}" maxlength="3" style="width:60px;text-transform:uppercase;">
          <select id="mth-${m.id}"><option value="bank_transfer">Bank transfer</option><option value="cash">Cash</option>
            <option value="card">Card</option><option value="payment_link">Payment link</option><option value="other">Other</option></select>
          <input id="ref-${m.id}" placeholder="Reference / receipt no." value="${e((m.rep && m.rep.reference) || '')}" style="min-width:160px;">
          <label class="muted">Paid on <input id="pd-${m.id}" type="date" value="${(m.rep && m.rep.paid_on) || today()}"></label>
          <label class="muted">Covers until <input id="pu-${m.id}" type="date" value="${addYear(base)}"></label>
          <button class="ok" onclick="recordPayment('${m.id}')">Record payment</button>
        </div></div>`;
      if (m.st === 'approved' || m.st === 'grace' || m.st === 'lapsed' || m.st === 'active') actions += payRow;
      const M = { bank_transfer: 'Bank transfer', cash: 'Cash', card: 'Card', payment_link: 'Payment link', other: 'Other' };
      const repBox = m.rep ? `<div style="margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid #fde68a;">
          <strong>Member reported a payment</strong> · ${new Date(m.rep.created_at).toLocaleDateString('en-GB')}<br>
          <span class="muted">${m.rep.amount ? e(m.rep.amount + ' ' + m.rep.currency) + ' · ' : ''}${e(M[m.rep.method] || m.rep.method)}${m.rep.reference ? ' · ref. ' + e(m.rep.reference) : ''}${m.rep.paid_on ? ' · paid ' + e(m.rep.paid_on) : ''}</span>
          ${m.rep.note ? `<div style="margin-top:4px;">“${e(m.rep.note)}”</div>` : ''}
          <div class="muted" style="margin-top:6px;">Check it against your account, then Record payment below (pre-filled). Not received? <a href="#" onclick="dismissReport('${m.rep.id}');return false;">Dismiss report</a></div></div>` : '';
      if (repBox) actions = repBox + actions;
      if (m.rep && !['approved', 'grace', 'lapsed', 'active'].includes(m.st)) actions += payRow;
      return `<div class="card">
        <div class="row" style="justify-content:space-between;">
          <div><strong>${name}</strong> <span class="muted">${e(m.email)}${m.phone ? ' · ' + e(m.phone) : ''}</span></div>
          <span class="pill s-${m.st}">${m.st}</span></div>
        <div class="grid muted">
          <div>${e([m.degree, m.year].filter(Boolean).join(' · '))}</div>
          <div>${e(m.school)}</div>
          <div>${e([m.city, m.country].filter(Boolean).join(', '))}</div>
          <div>Chapter: ${e(ch)}</div>
          <div>Referral: ${m.referred_by ? e(m.referred_by) : 'none'}</div>
          <div>${m.st === 'applicant' && waitDays !== null ? `Waiting ${waitDays} day${waitDays === 1 ? '' : 's'}` : 'Paid until: ' + fmt(m.paid_until)}</div>
        </div>
        ${m.application_message ? `<div style="margin-top:8px;">“${e(m.application_message)}”</div>` : ''}
        ${m.reviewed_by ? `<div class="muted" style="margin-top:6px;">Last change by ${e(m.reviewed_by)} on ${fmt(m.reviewed_at)}${m.review_note ? ' — ' + e(m.review_note) : ''}</div>` : ''}
        ${m.st === 'applicant' ? `<textarea id="note-${m.id}" placeholder="Note to applicant (required to reject; optional on approve)" style="margin-top:8px;"></textarea>` : ''}
        <div class="row" style="margin-top:8px;">${actions}</div></div>`;
    }

    async function setStatus(id, status) {
      const noteEl = $('note-' + id), note = noteEl ? noteEl.value.trim() : '';
      if (status === 'rejected' && !note) return flash('Add a note explaining the decision.', false);
      if (status === 'rejected' && !confirm('Reject this application?')) return;
      const patch = { membership_status: status };
      if (note) patch.review_note = note;
      const { error } = await sb.from('members').update(patch).eq('id', id);
      if (error) return flash(error.message, false);
      flash(status === 'approved' ? 'Approved — they now see the payment instructions.' : 'Application rejected.', true);
      load();
    }

    async function dismissReport(id) {
      if (!confirm('Dismiss this payment report? Only do this if the payment was not received.')) return;
      const { error } = await sb.from('payment_reports').update({ status: 'dismissed' }).eq('id', id);
      if (error) return flash(error.message, false);
      flash('Report dismissed.', true); load(); if (window.gsmpAdminRefreshBadges) gsmpAdminRefreshBadges();
    }

    async function recordPayment(id) {
      const amount = parseFloat($('amt-' + id).value), until = $('pu-' + id).value, paidOn = $('pd-' + id).value;
      const currency = $('cur-' + id).value.trim().toUpperCase(), method = $('mth-' + id).value, ref = $('ref-' + id).value.trim();
      if (!(amount > 0) || !until || !paidOn) return flash('Amount, payment date and "covers until" are required.', false);
      if (!confirm(`Record ${amount} ${currency} (${method.replace('_', ' ')}) and activate membership until ${fmt(until)}?`)) return;
      const { error } = await sb.rpc('record_membership_payment', { p_member: id, p_amount: amount, p_currency: currency,
        p_method: method, p_reference: ref, p_paid_at: paidOn, p_covers_until: until });
      if (error) return flash(error.message, false);
      flash(`Payment recorded — active until ${fmt(until)}.`, true); load();
    }
  </script>
</body>
</html>
