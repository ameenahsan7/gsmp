<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../../images/favicon-white.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Verified Portfolio — GSMP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy: #1B2A4A; --gold: #C49A3C; --ink: #111827; --muted: #6b7280; --line: #e5e7eb; --paper: #ffffff; --bg: #f5f3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    .page { max-width: 820px; margin: 24px auto; background: var(--paper); border: 1px solid var(--line); }
    .top { background: var(--navy); color: #fff; padding: 28px 32px; display: flex; justify-content: space-between; gap: 20px; align-items: center; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .12em; font-size: 12px; color: var(--gold); text-transform: uppercase; }
    .brand img { width: 30px; height: 30px; border-radius: 6px; }
    h1 { font-family: 'Playfair Display', serif; font-size: 34px; margin: 10px 0 4px; }
    .sub { color: rgba(255,255,255,.75); font-size: 14px; }
    #qr { background: #fff; padding: 6px; border-radius: 6px; }
    .banner { padding: 14px 32px; font-weight: 600; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .banner.active { background: #ecfdf5; color: #065f46; border-bottom: 1px solid #a7f3d0; }
    .banner.bad { background: #fef2f2; color: #991b1b; border-bottom: 1px solid #fecaca; }
    .body { padding: 8px 32px 28px; }
    .section { margin-top: 22px; }
    .section h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 0 0 6px; }
    .item { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
    .item:last-child { border-bottom: none; }
    .item h3 { margin: 0; font-size: 15px; color: var(--navy); }
    .item .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .item .desc { font-size: 13px; margin-top: 4px; }
    .tag { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; align-self: flex-start; }
    .tag.v { background: #d1fae5; color: #065f46; }
    .tag.s { background: #f3f4f6; color: #4b5563; }
    .bio { font-size: 14px; line-height: 1.6; color: #374151; }
    .contact { font-size: 14px; margin-top: 8px; }
    .foot { border-top: 1px solid var(--line); padding: 16px 32px; font-size: 11px; color: var(--muted); line-height: 1.6; }
    .actions { text-align: center; margin: 0 auto 24px; }
    .actions button { background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    .center { text-align: center; padding: 60px 24px; }
    @media (max-width: 600px) { .top, .body, .banner, .foot { padding-left: 18px; padding-right: 18px; } h1 { font-size: 26px; } .page { margin: 0; border: none; } }
    @media print {
      body { background: #fff; } .page { margin: 0; border: none; max-width: none; } .actions { display: none; }
      .top, .banner { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .item { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="page" id="page"><div class="center">Loading…</div></div>
  <div class="actions" id="actions" style="display:none;"><button onclick="window.print()">Download / print PDF</button></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../../js/supabase-config.js"></script>
  <script>
    const SECTIONS = { education: 'Education & degrees', clinical: 'Clinical experience', research: 'Research', award: 'Awards & honours' };
    const METHOD = { issuer_email: 'confirmed by issuer', registry_link: 'checked against official source', document_review: 'document reviewed' };
    const e = gsmpEsc;
    const fmt = d => d ? new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

    (async () => {
      const id = new URLSearchParams(location.search).get('id') || '';
      const page = document.getElementById('page');
      if (!/^[0-9a-f]{32}$/.test(id)) { page.innerHTML = '<div class="center"><h2>Invalid verification link</h2></div>'; return; }

      const { data: p, error } = await sb.rpc('get_portfolio_public', { p_public_id: id });
      if (error || !p) {
        page.innerHTML = '<div class="center"><h2>Portfolio not found</h2><p>This verification link is not valid. If you were given this document, treat its claims as unverified.</p></div>';
        return;
      }

      const active = p.status === 'active';
      const creds = [p.degree, p.specialty].filter(Boolean).map(e).join(' · ');
      const sub = [p.member_title, p.chapter ? p.chapter + ' Chapter' : null, p.country].filter(Boolean).map(e).join(' · ');
      const verifiedCount = (p.claims || []).filter(c => c.status === 'verified').length;

      let html = `<div class="top"><div>
          <div class="brand"><img src="../../images/pgcmp_logo_inverted.jpeg" alt="">GSMP Verified Portfolio</div>
          <h1>${e(p.name)}</h1>
          ${creds ? `<div class="sub">${creds}</div>` : ''}
          <div class="sub">${sub}</div>
          ${p.headline ? `<div class="sub" style="margin-top:6px;color:#fff;">${e(p.headline)}</div>` : ''}
        </div><div id="qr"></div></div>`;

      html += active
        ? `<div class="banner active">✓ Active · ${verifiedCount} verified credential${verifiedCount === 1 ? '' : 's'}${p.identity_verified ? ' · Identity verified' : ''} · Updated ${fmt(p.updated_at)}</div>`
        : p.status === 'paused'
          ? `<div class="banner bad">⏸ Verification paused — this member's GSMP membership has lapsed. Credentials are not currently vouched for by GSMP. Do not rely on any printed copy.</div>`
          : `<div class="banner bad">⚠ This portfolio is ${e(p.status).toUpperCase()}. Its credentials are no longer vouched for by GSMP. Do not rely on any printed copy.</div>`;

      if (active) {
        html += '<div class="body">';
        if (!(p.claims || []).length) html += '<div class="section"><p class="bio" style="color:#6b7280;">No credentials have been published on this portfolio yet.</p></div>';
        if (p.bio) html += `<div class="section"><h2>About <span style="color:#9ca3af;letter-spacing:0;text-transform:none;font-weight:500;">(self-declared)</span></h2><div class="bio">${e(p.bio).replace(/\n/g, '<br>')}</div>
          ${p.email || p.phone ? `<div class="contact">${p.email ? e(p.email) : ''}${p.email && p.phone ? ' · ' : ''}${p.phone ? e(p.phone) : ''}</div>` : ''}</div>`;
        for (const [k, label] of Object.entries(SECTIONS)) {
          const list = (p.claims || []).filter(c => c.section === k);
          if (!list.length) continue;
          html += `<div class="section"><h2>${label}</h2>` + list.map(c => {
            const meta = [c.organization, c.role, c.period].filter(Boolean).map(e).join(' · ');
            const tag = c.status === 'verified'
              ? `<span class="tag v" title="${e(METHOD[c.method] || 'verified')} on ${fmt(c.verified_at)}">✓ Verified</span>`
              : `<span class="tag s">Self-declared</span>`;
            return `<div class="item"><div><h3>${e(c.title)}</h3>${meta ? `<div class="meta">${meta}</div>` : ''}
              ${c.description ? `<div class="desc">${e(c.description)}</div>` : ''}
              ${c.status === 'verified' ? `<div class="meta" style="font-size:12px;">Verified ${fmt(c.verified_at)} — ${e(METHOD[c.method] || 'by GSMP')}</div>` : ''}
              </div>${tag}</div>`;
          }).join('') + '</div>';
        }
        html += '</div>';
      }

      html += `<div class="foot">
        <strong>What "Verified" means:</strong> GSMP confirmed this credential with its issuer or an official source on the date shown.
        It does not certify clinical competence. "Self-declared" items were provided by the member and not checked.
        This page is the live record — it overrides any printed or PDF copy.<br>
        Portfolio ID ${e(id)} · Version ${e(p.version)} · First issued ${fmt(p.published_at)}</div>`;

      page.innerHTML = html;
      if (window.QRCode) new QRCode(document.getElementById('qr'), { text: location.href, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M });
      if (active) document.getElementById('actions').style.display = '';
      document.title = p.name + ' — GSMP Verified Portfolio';
    })();
  </script>
</body>
</html>
